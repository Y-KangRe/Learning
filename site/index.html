<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的学习空间</title>
<style>
/* ══════════════════════════════════════
   主题变量 — Dark（默认）
══════════════════════════════════════ */
:root,
[data-theme="dark"] {
  --bg:       #0f1117;
  --bg2:      #161b27;
  --bg3:      #1e2535;
  --bg4:      #252d3d;
  --border:   rgba(255,255,255,0.07);
  --border2:  rgba(255,255,255,0.14);
  --border3:  rgba(255,255,255,0.22);
  --text:     #e8eaf0;
  --text2:    #8b90a0;
  --text3:    #555d72;
  --overlay:  rgba(0,0,0,0.72);
  --modal-shadow: 0 24px 64px rgba(0,0,0,0.65);
  --card-shadow:  0 4px 24px rgba(0,0,0,0.42);
  --title-grad: linear-gradient(135deg,#e8eaf0 30%,#a78bfa);
}

/* ══════════════════════════════════════
   主题变量 — Light
══════════════════════════════════════ */
[data-theme="light"] {
  --bg:       #f5f6fa;
  --bg2:      #ffffff;
  --bg3:      #f0f1f5;
  --bg4:      #e8eaf0;
  --border:   rgba(0,0,0,0.08);
  --border2:  rgba(0,0,0,0.14);
  --border3:  rgba(0,0,0,0.22);
  --text:     #1a1d2e;
  --text2:    #5a6078;
  --text3:    #9196aa;
  --overlay:  rgba(0,0,0,0.45);
  --modal-shadow: 0 24px 64px rgba(0,0,0,0.18);
  --card-shadow:  0 4px 16px rgba(0,0,0,0.08);
  --title-grad: linear-gradient(135deg,#1a1d2e 30%,#6c8aff);
}

/* ══════════════════════════════════════
   重置 & 通用
══════════════════════════════════════ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html {
  transition: background .25s, color .25s;
}

body {
  font-family: -apple-system,'PingFang SC','Microsoft YaHei',sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  transition: background .25s, color .25s;
}

/* 品牌色 — 不随主题变化 */
:root {
  --accent:  #6c8aff;
  --accent2: #a78bfa;
  --accent3: #34d399;
  --amber:   #fbbf24;
  --red:     #f87171;
  --pink:    #f472b6;
  --tag-bg:  rgba(108,138,255,0.12);
  --tag-txt: #9db4ff;
  --r:  12px;
  --rs:  8px;
}

/* ══════════════════════════════════════
   Sidebar
══════════════════════════════════════ */
.sidebar {
  width: 248px;
  flex-shrink: 0;
  background: var(--bg2);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  position: sticky;
  top: 0;
  height: 100vh;
  overflow-y: auto;
  transition: background .25s, border-color .25s;
}

.sidebar-logo {
  padding: 22px 20px 14px;
  font-size: 15px;
  font-weight: 700;
  color: var(--text);
  letter-spacing: -.3px;
  display: flex;
  align-items: center;
  gap: 10px;
}

.logo-dot {
  width: 9px; height: 9px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  box-shadow: 0 0 10px rgba(108,138,255,.5);
  flex-shrink: 0;
}

/* 搜索框 */
.sb-search {
  margin: 0 12px 14px;
  position: relative;
}
.sb-search input {
  width: 100%;
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: var(--rs);
  padding: 8px 12px 8px 32px;
  color: var(--text);
  font-size: 13px;
  outline: none;
  transition: border-color .2s, background .25s;
  font-family: inherit;
}
.sb-search input:focus { border-color: var(--accent); }
.sb-search input::placeholder { color: var(--text3); }
.sb-search .si {
  position: absolute; left: 10px; top: 50%;
  transform: translateY(-50%);
  color: var(--text3); font-size: 13px; pointer-events: none;
}

/* Nav 区块 */
.sb-section { padding: 0 12px; margin-bottom: 6px; }
.sb-lbl {
  font-size: 10px; font-weight: 600;
  color: var(--text3); text-transform: uppercase;
  letter-spacing: .08em; padding: 8px 8px 4px;
}

.nav-item {
  display: flex; align-items: center; gap: 9px;
  padding: 8px 10px;
  border-radius: var(--rs);
  cursor: pointer;
  font-size: 13.5px;
  color: var(--text2);
  transition: background .15s, color .15s;
  user-select: none;
}
.nav-item:hover { background: var(--bg3); color: var(--text); }
.nav-item.active { background: rgba(108,138,255,.15); color: var(--accent); }
.nav-item .ni { font-size: 15px; width: 20px; text-align: center; }
.nav-item .nbadge {
  margin-left: auto;
  background: var(--bg3);
  color: var(--text3);
  font-size: 11px;
  padding: 1px 7px;
  border-radius: 20px;
  border: 1px solid var(--border);
  transition: background .25s;
}

/* 标签云 */
.sb-tags { padding: 0 12px; margin-bottom: 14px; }
.tag-cloud { display: flex; flex-wrap: wrap; gap: 6px; padding: 4px 8px; }
.tag-pill {
  padding: 3px 10px;
  border-radius: 20px;
  background: var(--tag-bg);
  color: var(--tag-txt);
  font-size: 11.5px;
  cursor: pointer;
  border: 1px solid transparent;
  transition: all .15s;
}
.tag-pill:hover, .tag-pill.active {
  border-color: var(--accent);
  background: rgba(108,138,255,.22);
}

/* Sidebar 底部 */
.sb-bottom {
  margin-top: auto;
  padding: 14px 12px;
  border-top: 1px solid var(--border);
  transition: border-color .25s;
}

/* 主题切换按钮 */
.theme-toggle-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 10px;
  padding: 6px 8px;
  border-radius: var(--rs);
  background: var(--bg3);
  border: 1px solid var(--border);
  transition: background .25s;
  cursor: pointer;
  user-select: none;
}
.theme-toggle-label {
  font-size: 12.5px;
  color: var(--text2);
  display: flex;
  align-items: center;
  gap: 7px;
}
.theme-toggle-track {
  width: 38px; height: 20px;
  border-radius: 20px;
  background: var(--bg4);
  border: 1px solid var(--border2);
  position: relative;
  transition: background .25s;
  flex-shrink: 0;
}
[data-theme="light"] .theme-toggle-track { background: var(--accent); }
.theme-toggle-thumb {
  position: absolute;
  top: 2px; left: 2px;
  width: 14px; height: 14px;
  border-radius: 50%;
  background: var(--text2);
  transition: transform .22s cubic-bezier(.4,0,.2,1), background .25s;
}
[data-theme="light"] .theme-toggle-thumb {
  transform: translateX(18px);
  background: #fff;
}

.add-btn {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  width: 100%;
  padding: 10px;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  border: none; border-radius: var(--rs);
  color: #fff; font-size: 13.5px; font-weight: 600;
  cursor: pointer;
  transition: opacity .2s, transform .15s;
  font-family: inherit;
}
.add-btn:hover { opacity: .88; transform: translateY(-1px); }
.add-btn:active { transform: translateY(0); }

/* ══════════════════════════════════════
   Main Content
══════════════════════════════════════ */
.main {
  flex: 1;
  overflow-y: auto;
  padding: 32px 36px;
  min-width: 0;
}

.main-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 26px;
}

.page-title {
  font-size: 22px; font-weight: 700; letter-spacing: -.4px;
}
.page-title span {
  background: var(--title-grad);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.header-right { display: flex; align-items: center; gap: 10px; }

.view-toggle {
  display: flex; gap: 3px;
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--rs);
  padding: 3px;
  transition: background .25s;
}
.view-btn {
  padding: 5px 10px;
  border-radius: 5px; border: none;
  background: transparent;
  color: var(--text2); cursor: pointer;
  font-size: 14px;
  transition: all .15s;
}
.view-btn.active { background: var(--bg3); color: var(--text); }

/* ── Stats ── */
.stats-bar {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
  margin-bottom: 26px;
}
.stat-card {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--r);
  padding: 16px 18px;
  transition: border-color .2s, background .25s, transform .15s;
}
.stat-card:hover { border-color: var(--border2); transform: translateY(-1px); }
.stat-label { font-size: 12px; color: var(--text3); margin-bottom: 6px; }
.stat-value { font-size: 26px; font-weight: 700; letter-spacing: -.5px; }
.sv-blue   { color: var(--accent);  }
.sv-purple { color: var(--accent2); }
.sv-green  { color: var(--accent3); }
.sv-amber  { color: var(--amber);   }
.stat-sub  { font-size: 11px; color: var(--text3); margin-top: 4px; }

/* ── Filter Bar ── */
.filter-bar { display: flex; gap: 8px; margin-bottom: 18px; flex-wrap: wrap; }
.filter-chip {
  padding: 5px 14px;
  border-radius: 20px;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--text2);
  font-size: 12.5px;
  cursor: pointer;
  transition: all .15s;
  font-family: inherit;
}
.filter-chip:hover { border-color: var(--border2); color: var(--text); }
.filter-chip.active {
  border-color: var(--accent);
  background: rgba(108,138,255,.12);
  color: var(--accent);
}

/* ── Section Label ── */
.section-label {
  font-size: 11px; font-weight: 600;
  color: var(--text3); text-transform: uppercase;
  letter-spacing: .08em;
  margin-bottom: 14px;
  display: flex; align-items: center; gap: 10px;
}
.section-label::after {
  content: ''; flex: 1; height: 1px; background: var(--border);
}

/* ── Card Grid ── */
.card-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 14px;
}
.card-grid.list-view { grid-template-columns: 1fr; }

.resource-card {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--r);
  padding: 18px;
  cursor: pointer;
  transition: border-color .2s, transform .2s, box-shadow .2s, background .25s;
  position: relative;
  overflow: hidden;
}
.resource-card::before {
  content: '';
  position: absolute; top: 0; left: 0; right: 0; height: 2.5px;
  opacity: 0; transition: opacity .2s;
}
.resource-card.type-link::before  { background: linear-gradient(90deg,var(--accent),var(--accent2)); }
.resource-card.type-note::before  { background: linear-gradient(90deg,var(--accent3),#059669); }
.resource-card.type-video::before { background: linear-gradient(90deg,var(--red),var(--pink)); }
.resource-card.type-pdf::before   { background: linear-gradient(90deg,var(--amber),#f59e0b); }

.resource-card:hover {
  border-color: var(--border2);
  transform: translateY(-3px);
  box-shadow: var(--card-shadow);
}
.resource-card:hover::before { opacity: 1; }

.card-top {
  display: flex; align-items: flex-start;
  justify-content: space-between; margin-bottom: 10px;
}

.card-badge {
  display: flex; align-items: center; gap: 5px;
  font-size: 11px; padding: 3px 9px;
  border-radius: 20px; font-weight: 500;
}
.badge-link  { background: rgba(108,138,255,.15); color: var(--accent);  }
.badge-note  { background: rgba(52,211,153,.15);  color: var(--accent3); }
.badge-video { background: rgba(248,113,113,.15); color: var(--red);     }
.badge-pdf   { background: rgba(251,191,36,.15);  color: var(--amber);   }

.card-actions { display: flex; gap: 4px; }
.card-action-btn {
  width: 26px; height: 26px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 6px; color: var(--text3);
  transition: all .15s; font-size: 13px; cursor: pointer;
}
.card-action-btn:hover { background: var(--bg3); color: var(--text); }

.card-title {
  font-size: 14.5px; font-weight: 600; color: var(--text);
  margin-bottom: 6px; line-height: 1.45;
  display: -webkit-box;
  -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.card-desc {
  font-size: 13px; color: var(--text2); line-height: 1.65;
  display: -webkit-box;
  -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
  margin-bottom: 12px;
}
.card-url {
  font-size: 11.5px; color: var(--text3); margin-bottom: 12px;
  display: flex; align-items: center; gap: 4px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.card-footer {
  display: flex; align-items: center; justify-content: space-between;
  padding-top: 10px; border-top: 1px solid var(--border);
  transition: border-color .25s;
}
.card-tags { display: flex; flex-wrap: wrap; gap: 5px; }
.card-tag {
  padding: 2px 8px; border-radius: 20px;
  background: var(--tag-bg); color: var(--tag-txt); font-size: 11px;
  cursor: pointer; transition: background .15s;
}
.card-tag:hover { background: rgba(108,138,255,.25); }
.card-date { font-size: 11px; color: var(--text3); white-space: nowrap; }

/* ── Empty ── */
.empty-state {
  text-align: center; padding: 64px 20px;
  grid-column: 1 / -1;
}
.empty-icon { font-size: 48px; margin-bottom: 12px; }
.empty-state p { font-size: 14px; margin-bottom: 18px; color: var(--text2); }

/* ══════════════════════════════════════
   Modal
══════════════════════════════════════ */
.modal-overlay {
  position: fixed; inset: 0;
  background: var(--overlay);
  backdrop-filter: blur(5px);
  display: flex; align-items: center; justify-content: center;
  z-index: 200;
  opacity: 0; pointer-events: none;
  transition: opacity .22s;
}
.modal-overlay.open { opacity: 1; pointer-events: all; }

.modal {
  background: var(--bg2);
  border: 1px solid var(--border2);
  border-radius: 18px;
  padding: 28px;
  width: 530px; max-width: 93vw; max-height: 90vh;
  overflow-y: auto;
  box-shadow: var(--modal-shadow);
  transform: translateY(14px) scale(.98);
  transition: transform .22s cubic-bezier(.4,0,.2,1), background .25s;
}
.modal-overlay.open .modal { transform: translateY(0) scale(1); }

.modal-header {
  font-size: 16px; font-weight: 700; margin-bottom: 22px;
  display: flex; align-items: center; justify-content: space-between;
}
.modal-close {
  width: 28px; height: 28px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 7px; cursor: pointer;
  color: var(--text2); background: var(--bg3);
  font-size: 14px; transition: all .15s;
}
.modal-close:hover { color: var(--text); }

.form-group { margin-bottom: 16px; }
.form-label {
  font-size: 11px; font-weight: 600; color: var(--text2);
  margin-bottom: 7px; text-transform: uppercase; letter-spacing: .06em;
}
.form-input, .form-textarea {
  width: 100%;
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: var(--rs);
  padding: 9px 12px;
  color: var(--text); font-size: 13.5px; font-family: inherit;
  outline: none; transition: border-color .2s, background .25s;
}
.form-input:focus, .form-textarea:focus { border-color: var(--accent); }
.form-input::placeholder, .form-textarea::placeholder { color: var(--text3); }
.form-textarea { resize: vertical; min-height: 90px; line-height: 1.65; }

.type-grid {
  display: grid; grid-template-columns: repeat(4,1fr); gap: 8px;
}
.type-opt {
  padding: 10px 4px; border-radius: var(--rs);
  border: 1px solid var(--border);
  background: var(--bg3); color: var(--text2);
  font-size: 11.5px; text-align: center;
  cursor: pointer; transition: all .15s; font-family: inherit;
}
.type-opt .ti { font-size: 20px; display: block; margin-bottom: 4px; }
.type-opt.active {
  border-color: var(--accent);
  background: rgba(108,138,255,.12);
  color: var(--accent);
}

.modal-footer {
  display: flex; gap: 10px; justify-content: flex-end;
  margin-top: 22px; padding-top: 16px;
  border-top: 1px solid var(--border);
  transition: border-color .25s;
}

.btn-cancel {
  padding: 9px 18px; border-radius: var(--rs);
  border: 1px solid var(--border);
  background: transparent; color: var(--text2);
  font-size: 13px; cursor: pointer;
  transition: all .15s; font-family: inherit;
}
.btn-cancel:hover { background: var(--bg3); color: var(--text); }

.btn-save {
  padding: 9px 22px; border-radius: var(--rs); border: none;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  color: #fff; font-size: 13px; font-weight: 600;
  cursor: pointer; transition: opacity .2s; font-family: inherit;
}
.btn-save:hover { opacity: .86; }

/* ── Detail Modal ── */
.detail-url-link {
  display: inline-flex; align-items: center; gap: 6px;
  color: var(--accent); font-size: 13px; text-decoration: none;
  padding: 7px 14px;
  background: rgba(108,138,255,.1);
  border-radius: var(--rs); border: 1px solid rgba(108,138,255,.25);
  transition: background .15s;
}
.detail-url-link:hover { background: rgba(108,138,255,.2); }
.detail-desc-block {
  background: var(--bg3); border-radius: var(--rs);
  padding: 14px 16px; font-size: 13.5px;
  color: var(--text2); line-height: 1.75;
  border: 1px solid var(--border);
  white-space: pre-wrap;
  transition: background .25s;
}
.detail-tags { display: flex; flex-wrap: wrap; gap: 7px; }
.detail-tag {
  padding: 4px 12px; border-radius: 20px;
  background: var(--tag-bg); color: var(--tag-txt); font-size: 12px;
}

/* ── Toast ── */
.toast {
  position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%) translateY(12px);
  background: var(--bg3); border: 1px solid var(--border2);
  border-radius: 24px; padding: 9px 20px;
  font-size: 13px; color: var(--text); white-space: nowrap;
  box-shadow: var(--card-shadow);
  opacity: 0; transition: opacity .2s, transform .2s;
  z-index: 300; pointer-events: none;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ── Upload Zone ── */
.upload-zone {
  border: 2px dashed var(--border2);
  border-radius: var(--r);
  padding: 28px 20px;
  text-align: center;
  cursor: pointer;
  transition: all .2s;
  background: var(--bg3);
  position: relative;
  margin-bottom: 14px;
}
.upload-zone:hover, .upload-zone.drag-over {
  border-color: var(--accent);
  background: rgba(108,138,255,.08);
}
.upload-zone input[type="file"] {
  position: absolute; inset: 0; opacity: 0; cursor: pointer;
}
.upload-icon { font-size: 36px; margin-bottom: 8px; }
.upload-text { font-size: 13.5px; color: var(--text); margin-bottom: 4px; font-weight: 500; }
.upload-hint { font-size: 11.5px; color: var(--text3); }
.file-info-row {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 14px;
  background: var(--bg3);
  border-radius: var(--rs);
  border: 1px solid var(--border);
  margin-bottom: 14px;
  transition: background .25s;
}
.file-icon { font-size: 24px; flex-shrink: 0; }
.file-name { font-size: 13px; color: var(--text); font-weight: 500; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.file-size { font-size: 11px; color: var(--text3); white-space: nowrap; }
.file-remove {
  width: 24px; height: 24px; display: flex; align-items: center; justify-content: center;
  border-radius: 50%; cursor: pointer; color: var(--text3); font-size: 14px;
  transition: all .15s; flex-shrink: 0;
}
.file-remove:hover { background: rgba(248,113,113,.15); color: var(--red); }

/* File card variant */
.resource-card.type-file::before { background: linear-gradient(90deg,#6366f1,#8b5cf6); }
.badge-file { background: rgba(99,102,241,.15); color: #818cf8; }

/* Download button */
.btn-download {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 8px 16px;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  color: #fff; border: none; border-radius: var(--rs);
  font-size: 13px; font-weight: 600; cursor: pointer;
  transition: opacity .2s; font-family: inherit; text-decoration: none;
}
.btn-download:hover { opacity: .86; }

/* ── Responsive ── */
@media (max-width: 800px) {
  .sidebar { display: none; }
  .main { padding: 20px 16px; }
  .stats-bar { grid-template-columns: repeat(2,1fr); }
  .card-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<!-- ═══════════ SIDEBAR ═══════════ -->
<aside class="sidebar">
  <div class="sidebar-logo">
    <div class="logo-dot"></div>
    我的学习空间
  </div>

  <div class="sb-search">
    <span class="si">🔍</span>

/* ══════════════════════════════════════
   IndexedDB — 文件存储
══════════════════════════════════════ */
const FileDB = (() => {
  const DB_NAME = 'LearningFiles';
  const DB_VER  = 1;

  function open() {
    return new Promise((resolve, reject) => {
      const req = indexedDB.open(DB_NAME, DB_VER);
      req.onupgradeneeded = () => {
        const db = req.result;
        if (!db.objectStoreNames.contains('files'))
          db.createObjectStore('files', { keyPath: 'id' });
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror   = () => reject(req.error);
    });
  }

  async function saveFile(id, file) {
    const db = await open();
    return new Promise((resolve, reject) => {
      const tx = db.transaction('files', 'readwrite');
      tx.objectStore('files').put({ id, name: file.name, size: file.size, type: file.type, lastModified: file.lastModified, data: file });
      tx.oncomplete = () => resolve();
      tx.onerror    = () => reject(tx.error);
    });
  }

  async function getFile(id) {
    const db = await open();
    return new Promise((resolve, reject) => {
      const tx = db.transaction('files', 'readonly');
      const req = tx.objectStore('files').get(id);
      req.onsuccess = () => resolve(req.result);
      req.onerror   = () => reject(req.error);
    });
  }

  async function deleteFile(id) {
    const db = await open();
    return new Promise((resolve, reject) => {
      const tx = db.transaction('files', 'readwrite');
      tx.objectStore('files').delete(id);
      tx.oncomplete = () => resolve();
      tx.onerror    = () => reject(tx.error);
    });
  }

  return { saveFile, getFile, deleteFile };
})();

/* 文件图标映射 */
function getFileIcon(name) {
  const ext = (name||'').split('.').pop().toLowerCase();
  const map = {
    pdf:'📕', doc:'📘', docx:'📘', xls:'📊', xlsx:'📊',
    ppt:'📽️', pptx:'📽️', py:'🐍', js:'🟨', ts:'🔷',
    html:'🌐', css:'🎨', java:'☕', c:'⚙️', cpp:'⚙️',
    go:'🔵', rs:'🦀', rb:'💎', php:'🐘', json:'📋',
    xml:'📋', md:'📝', txt:'📄', sql:'🗄️', zip:'📦',
    rar:'📦', '7z':'📦', png:'🖼️', jpg:'🖼️',
    jpeg:'🖼️', gif:'🎞️', svg:'🎨', webp:'🖼️', mp4:'🎬',
  };
  return map[ext] || '📁';
}
function formatSize(bytes) {
  if (!bytes) return '';
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
  return (bytes / 1048576).toFixed(1) + ' MB';
}

function filtered() {
  let r = [...items];
  if (currentNav    !== 'all') r = r.filter(i => i.type === currentNav);
  if (currentFilter !== 'all') r = r.filter(i => i.type === currentFilter);
  if (activeTag)                r = r.filter(i => i.tags && i.tags.includes(activeTag));
  if (currentSearch) {
    const q = currentSearch.toLowerCase();
    r = r.filter(i =>
      i.title.toLowerCase().includes(q) ||
      (i.desc  && i.desc.toLowerCase().includes(q)) ||
      (i.tags  && i.tags.some(t => t.toLowerCase().includes(q)))
    );
  }
  return r.sort((a,b) => b.id - a.id);
}

function renderCards() {
  const grid = document.getElementById('cardGrid');
  const list = filtered();

  if (!list.length) {
    grid.innerHTML = `<div class="empty-state">
      <div class="empty-icon">✦</div>
      <p>还没有内容，点击「添加新内容」开始记录吧</p>
      <button class="btn-save" onclick="openAddModal()">＋ 添加第一条</button>
    </div>`;
    grid.className = 'card-grid';
    return;
  }

  const typeLabel = {note:'笔记',link:'链接',video:'视频',pdf:'PDF',file:'文件'};
  const typeIcon  = {note:'📝',link:'🔗',video:'▶',pdf:'📄',file:'📁'};

    const tags = (item.tags||[]).map(t =>
      `<span class="card-tag" onclick="event.stopPropagation();setActiveTag('${t}')">${t}</span>`
    ).join('');
    const urlBlock = item.url
      ? `<div class="card-url">🌐 ${item.url.replace(/^https?:\/\//,'').slice(0,50)}</div>` : '';
    const fileBlock = item.fileName
      ? `<div class="card-url">${getFileIcon(item.fileName)} ${item.fileName} · ${formatSize(item.fileSize)}</div>` : '';
    return `<div class="resource-card type-${item.type}" onclick="openDetail(${item.id})">
      <div class="card-top">

function renderTags() {
  const map = {};
  items.forEach(i => (i.tags||[]).forEach(t => map[t] = (map[t]||0)+1));
  const sorted = Object.entries(map).sort((a,b)=>b[1]-a[1]).slice(0,18);
  document.getElementById('tagCloud').innerHTML = sorted.map(([t]) =>
    `<span class="tag-pill${activeTag===t?' active':''}" onclick="setActiveTag('${t}')">${t}</span>`
  ).join('');
}

    shake(document.getElementById('inputTitle'));
    return;
  }
  const tags = document.getElementById('inputTags').value.split(/[\s,，]+/).filter(Boolean);
  const eid  = document.getElementById('editingId').value;

  const fileData = pendingFile
    ? { fileName: pendingFile.name, fileSize: pendingFile.size, fileType: pendingFile.type, fileId: 'f' + Date.now() }
    : null;

  if (eid) {
    const idx = items.findIndex(i => i.id == eid);
    if (idx > -1) {
      const old = items[idx];
      const updated = { ...old,
        type:  currentType,
        title,
        desc:  document.getElementById('inputDesc').value.trim(),
        url:   document.getElementById('inputUrl').value.trim(),
        tags,
      };

      if (fileData) {
        // 替换文件：删旧存新
        if (old.fileId) { try { await FileDB.deleteFile(old.fileId); } catch(e){} }
        Object.assign(updated, fileData);
        await FileDB.saveFile(fileData.fileId, pendingFile);
      } else if (fileRemoved && old.fileId) {
        // 用户主动移除了文件
        try { await FileDB.deleteFile(old.fileId); } catch(e){}
        delete updated.fileName; delete updated.fileSize; delete updated.fileType; delete updated.fileId;
      }
      // 否则：没动过文件，保留原文件引用不变

      items[idx] = updated;
    }
    toast('已更新 ✓');
  } else {
    const newItem = {
      id: Date.now(), type: currentType, title,
      desc: document.getElementById('inputDesc').value.trim(),
      url:  document.getElementById('inputUrl').value.trim(),
      tags,
      date: new Date().toISOString().slice(0,10)
    };
    if (fileData) {
      Object.assign(newItem, fileData);
      await FileDB.saveFile(fileData.fileId, pendingFile);
    }
    items.unshift(newItem);
    toast('已保存 ✓');
  }

  save();
  closeAddModal();
  render();
}

/* ══════════════════════════════════════
   详情 Modal
══════════════════════════════════════ */
function openDetail(id) {
  const item = items.find(i => i.id === id);
  if (!item) return;
  detailId = id;
  const typeLabel = {note:'笔记',link:'链接',video:'视频',pdf:'PDF',file:'文件'};
  const typeIcon  = {note:'📝',link:'🔗',video:'▶',pdf:'📄',file:'📁'};

  document.getElementById('detailBadge').innerHTML =
    `<span class="card-badge badge-${item.type}">${typeIcon[item.type]} ${typeLabel[item.type]}</span>`;

  let html = `<h2 style="font-size:17px;font-weight:700;line-height:1.45;margin-bottom:14px;color:var(--text)">${esc(item.title)}</h2>`;

  if (item.url) {
    html += `<div style="margin-bottom:14px">
      <a href="${item.url}" target="_blank" rel="noopener" class="detail-url-link">
        🌐 打开链接 ↗
      </a>
    </div>`;
  }

  if (item.fileName) {
    html += `<div style="margin-bottom:14px">
      <div class="file-info-row">
        <span class="file-icon">${getFileIcon(item.fileName)}</span>
        <span class="file-name">${esc(item.fileName)}</span>
        <span class="file-size">${formatSize(item.fileSize)}</span>
      </div>
      <button class="btn-download" onclick="downloadFile(${item.id})" style="margin-top:8px">
        ⬇ 下载文件
      </button>
    </div>`;
  }

  if (item.desc) {
    html += `<div style="margin-bottom:14px">
      <div class="form-label" style="margin-bottom:8px">内容 / 感悟</div>
      <div class="detail-desc-block">${esc(item.desc)}</div>
    </div>`;
  }

  if (item.tags && item.tags.length) {
    html += `<div>
      <div class="form-label" style="margin-bottom:8px">标签</div>
      <div class="detail-tags">${item.tags.map(t=>`<span class="detail-tag">${esc(t)}</span>`).join('')}</div>
    </div>`;
  }

  html += `<p style="margin-top:14px;font-size:11px;color:var(--text3)">添加于 ${item.date}</p>`;
  document.getElementById('detailContent').innerHTML = html;
  document.getElementById('detailOverlay').classList.add('open');
}

function closeDetailModal() {
  document.getElementById('detailOverlay').classList.remove('open');
}

/* ══════════════════════════════════════
   文件操作
══════════════════════════════════════ */
function handleFileSelect(e) {
  const file = e.target.files[0];
  if (!file) return;
  if (file.size > 50 * 1024 * 1024) {
    toast('文件不能超过 50MB');
    return;
  }
  pendingFile = file;
  fileRemoved = false;
  showFileInfo(file);
}

function showFileInfo(file) {
  document.getElementById('fileIcon').textContent = getFileIcon(file.name);
  document.getElementById('fileName').textContent = file.name;
  document.getElementById('fileSize').textContent = formatSize(file.size);
  document.getElementById('fileInfoRow').style.display = 'flex';
  document.getElementById('uploadZone').style.display = 'none';
}

function removeFile() {
  pendingFile = null;
  fileRemoved = true;
  document.getElementById('fileInput').value = '';
  document.getElementById('fileInfoRow').style.display = 'none';
  document.getElementById('uploadZone').style.display = '';
}

async function downloadFile(id) {
  try {
    const f = await FileDB.getFile(id);
    if (!f) { toast('文件不存在'); return; }
    const blob = new Blob([f.data], { type: f.type });
    const url  = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = f.name;
    a.click();
    URL.revokeObjectURL(url);
    toast('开始下载 ✓');
  } catch(e) {
    toast('下载失败');
  }
}

/* 拖拽上传 */
document.addEventListener('DOMContentLoaded', () => {
  const zone = document.getElementById('uploadZone');
  if (!zone) return;
  ['dragenter','dragover'].forEach(ev => {
    zone.addEventListener(ev, e => { e.preventDefault(); zone.classList.add('drag-over'); });
  });
  ['dragleave','drop'].forEach(ev => {
    zone.addEventListener(ev, e => { e.preventDefault(); zone.classList.remove('drag-over'); });
  });
  zone.addEventListener('drop', e => {
    const file = e.dataTransfer.files[0];
    if (!file) return;
    if (file.size > 50 * 1024 * 1024) { toast('文件不能超过 50MB'); return; }
    pendingFile = file;
    fileRemoved = false;
    showFileInfo(file);
  });
});

/* ══════════════════════════════════════
   工具函数
══════════════════════════════════════ */
function deleteItem(id) {
  if (!confirm('确认删除这条内容？')) return;
  const item = items.find(i => i.id === id);
  if (item && item.fileId) FileDB.deleteFile(item.fileId).catch(()=>{});
  items = items.filter(i => i.id !== id);
  save();
  render();
  toast('已删除');
}

function closeOnBg(e, id) {
  if (e.target === document.getElementById(id))
    document.getElementById(id).classList.remove('open');
}

function esc(s) {
  return String(s)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}

function shake(el) {
  el.style.borderColor = 'var(--red)';
  el.animate([
    {transform:'translateX(0)'},{transform:'translateX(-5px)'},
    {transform:'translateX(5px)'},{transform:'translateX(0)'}
  ], {duration:250, easing:'ease-in-out'});
  setTimeout(() => el.style.borderColor = '', 1400);
}

let toastTimer;
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

/* 键盘快捷键 */
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    closeAddModal();
    closeDetailModal();
  }
  if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
    e.preventDefault();
    document.getElementById('globalSearch').focus();
  }
  if ((e.metaKey || e.ctrlKey) && e.key === 'n') {
    e.preventDefault();
    openAddModal();
  }
});
</script>
